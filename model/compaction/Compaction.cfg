\* TLC Configuration for Compaction Ghost Guard Model
\*
\* Verifies that the Ghost Guard prevents the Leapfrog Hazard
\* where compaction could resurrect a deleted key.
\*
\* Run with: java -XX:+UseParallelGC -jar tla2tools.jar -config Compaction.cfg Compaction.tla

CONSTANTS
    k1 = k1
    k2 = k2
    k3 = k3
    Keys = {k1, k2, k3}
    NoKey = NoKey

    \* Enough versions to cover multiple put/delete cycles
    MaxVersion = 8

    \* Enough segments for relocations
    MaxSegment = 8

SPECIFICATION Spec

\* Safety Invariants
INVARIANTS
    InvType
    InvNoGhostResurrection
    InvNoDataLoss
    InvTombstoneIntegrity
    InvRelocationPreservesState

\* Liveness
PROPERTY
    PropCompactorCompletes
