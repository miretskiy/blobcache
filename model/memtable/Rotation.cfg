\* TLC Configuration for MemTable Rotation Model
\*
\* Verifies barrier synchronization prevents slow writers from
\* corrupting slab handoff during rotation.
\*
\* Run with: java -XX:+UseParallelGC -jar tla2tools.jar -config Rotation.cfg Rotation.tla

CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    Writers = {w1, w2, w3}

    \* More thorough bounds - 3 writers is the sweet spot
    MaxSeqID = 8

    \* 3 slabs allows 2 full rotations
    MaxSlabs = 3

SPECIFICATION Spec

\* Safety Invariants - must hold in EVERY reachable state
INVARIANTS
    InvType
    InvNoWriteAfterFlush
    InvSeqIDTracked
    InvPendingCountSanity
    InvBarrierConsistency
    InvSealedNoNewEntry

\* Liveness Properties - must hold across all behaviors
PROPERTIES
    PropRotationCompletes
    PropWritesComplete
    PropWaitingResumes
