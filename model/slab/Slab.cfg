\* TLC Configuration for Slab Reference Counting Model
\*
\* This verifies the "Fresh Struct" strategy prevents the ABA problem.
\*
\* Run with: java -XX:+UseParallelGC -jar tla2tools.jar -config Slab.cfg Slab.tla

CONSTANTS
    \* Memory IDs (raw []byte buffers in the pool)
    \* Small set is sufficient - ABA can happen with just 1 memory block
    m1 = m1
    m2 = m2
    MemoryIDs = {m1, m2}

    \* Maximum struct IDs to allocate
    \* Needs to be > MemoryIDs to allow memory recycling with new structs
    MaxStructID = 4

    \* Reader processes (Librarian lookups)
    r1 = r1
    r2 = r2
    Readers = {r1, r2}

SPECIFICATION Spec

\* Safety Invariants - must hold in EVERY reachable state
INVARIANTS
    InvType
    InvSafeAccess
    InvNoDoubleFree
    InvRefCountSanity
    InvMemoryAccounting

\* Liveness Property
PROPERTY
    PropReaderResolves
