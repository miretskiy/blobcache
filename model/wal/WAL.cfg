\* TLC Configuration for WAL Group Commit Model
\*
\* Run with: java -XX:+UseParallelGC -jar tla2tools.jar -config WAL.cfg WAL.tla

CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    Writers = {w1, w2, w3}
    MaxSeqID = 4
    MaxQueueLen = 4

SPECIFICATION Spec

\* Safety Invariants - must hold in EVERY reachable state
INVARIANTS
    InvType
    InvSingleLeader
    InvDurability

\* Safety Properties - must hold across all behaviors
PROPERTIES
    PropCrashSafe

\* Liveness Property - pending writes eventually complete
\* Note: This requires fairness (included in Spec) and is checked
\* across all behaviors including those with crashes. TLC verifies
\* that even with crashes, pending writers eventually return to idle.
PROPERTY
    PropWriteCompletes
